<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE GLITCH</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="masthead">
      <!-- Band 1: Utility & Theme Switcher -->
      <div class="masthead-utility">
  <span>VOL. 01 — NO. 001 | FREE EDITION</span>
  <div class="utility-right">
    <div class="theme-switcher">
      <button class="theme-btn active" data-theme="newsprint">NEWSPRINT</button>
      <button class="theme-btn" data-theme="aged">AGED</button>
      <button class="theme-btn" data-theme="night">NIGHT INK</button>
    </div>
    <button id="search-toggle" class="search-toggle" aria-label="Open search" title="Search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </div>
</div>

      <!-- Band 2: Boxed Ears + Main Title -->
      <div class="masthead-main">
        <div class="ear-box">
          <strong>PRICE: $0.00</strong>
          <span class="accent-text">(SYSTEM ERROR)</span>
        </div>

        <div class="masthead-title">
          <h1>THE GLITCH</h1>
        </div>

        <div class="ear-box">
          <strong>NO PAYWALLS</strong>
          <span>LIKE A NEWSPAPER</span>
        </div>
      </div>

      <!-- Band 3: Live Date Bar -->
      <div class="masthead-datebar">
        <span id="live-date">LOADING DATE...</span>
        <span class="motto">“Built well. Priced wrong.”</span>
        <span>TECH • GAMES • REVIEWS</span>
      </div>

      <!-- Band 4: Full Category Navigation -->
      <nav class="main-nav">
  <a href="#" class="active-nav" data-nav="all">Front Page</a>
  <a href="#" data-nav="tech">Tech</a>
  <a href="#" data-nav="games">Games</a>
  <a href="#" data-nav="world">World</a>
  <a href="#" data-nav="reviews">Reviews</a>
  
</nav>

<form id="search-form" class="search-bar">
  <input
    type="search"
    id="search-input"
    placeholder="Search headlines, topics, or keywords..."
    aria-label="Search stories"
  />
  <button type="submit" id="search-btn">SEARCH</button>
</form>
    </header>
    <main class="broadsheet-grid">
    <!-- Lead Story (Auto-loaded from articles.json) -->
<div id="lead-story-container"></div>

<!-- Secondary Stories (Auto-loaded from articles.json) -->
<section id="secondary-stories-container" class="secondary-stories"></section>
      

    
    </main>

        <h1 id="modal-title"></h1>
        <p class="modal-deck" id="modal-deck"></p>
        <p class="byline" id="modal-byline"></p>

        <div class="glitch-art">
          <img id="modal-img" class="article-img" src="" alt="" />
        </div>

        <div id="modal-body"></div>

        <div class="modal-footer-stamp">
          <span class="accent-text">●</span> FREE EDITION — READ FOR $0.00. NO
          POP-UPS, NO PAYWALLS. <span class="accent-text">●</span>
        </div>
      </article>
    </div>

    <script src="script.js"></script>
  </body>
</html>
